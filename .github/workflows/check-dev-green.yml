name: Check results in api-dev vs api-dev-green

on:
  workflow_dispatch:
  schedule:
    - cron: "38 17 * * MON-FRI"

concurrency:
  group: check-dev-green
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/setup.yml
  check:
    name: Check route branching
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Get run URLs for each step
        id: run_urls
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          # https://cmbuckley.co.uk/blog/2024/04/09/deep-links-to-github-actions-job-logs/
          gh -R $REPO run view $RUN_ID --attempt $ATTEMPT --json jobs --jq '
            .jobs[] | 
            select(.name == "Check route branching") |
            [.] |
            map({step: .steps[], url} | {(.step.name): .url + "#step:\(.step.number):1"}) |
            add(.[]) |
            @json "run_urls=\(.)"
          ' | tee -a $GITHUB_OUTPUT
      - name: Load asdf and Elixir dependencies
        uses: $/.github/actions/load-setup
        with:
          cache-key-asdf: ${{ needs.setup.outputs.cache-key-asdf }}
          cache-key-mix: ${{ needs.setup.outputs.cache-key-mix }}
      - name: Check route branching on api-dev
        id: check-dev
        run: mix check_route_branching
        env:
          API_KEY: ${{secrets.DEV_API_KEY}}
          API_URL: ${{secrets.DEV_API_URL}}
          LOG_LEVEL: notice
      - name: Report failure for api-dev
        if: ${{ failure() && steps.check-dev.outcome == 'failure' }}
        env:
          RUN_URL: ${{ fromJSON(steps.run_urls.outputs.run_urls)['Check route branching on api-dev'] }}
          SLACK_WEBHOOK: ${{ secrets.CHECKS_SLACK_WEBHOOK }}
        run: |
          jq --null-input '{text: "‼️ Route branching failing for api-dev!", url: env.RUN_URL}' | \
            curl -X POST --json @- $SLACK_WEBHOOK
      - name: Prepare diffs
        run: |
          cd route-branching
          git init --initial-branch=main
          git config user.email runner@example.com
          git config user.name gha
          git add .
          git commit -m "calculate route branching for api-dev"
          rm -r *
      - name: Check route branching on api-dev-green
        id: check-dev-green
        run: mix check_route_branching
        env:
          API_KEY: ${{secrets.DEV_GREEN_API_KEY}}
          API_URL: ${{secrets.DEV_GREEN_API_URL}}
          LOG_LEVEL: notice
      - name: Report failure for api-dev-green
        if: ${{ failure() && steps.check-dev-green.outcome == 'failure' }}
        env:
          RUN_URL: ${{ fromJSON(steps.run_urls.outputs.run_urls)['Check route branching on api-dev-green'] }}
          SLACK_WEBHOOK: ${{ secrets.CHECKS_SLACK_WEBHOOK }}
        run: |
          jq --null-input '{text: "‼️ Route branching failing for api-dev-green!", url: env.RUN_URL}' | \
            curl -X POST --json @- $SLACK_WEBHOOK
      - name: Calculate diffs
        id: diff
        continue-on-error: true
        run: |
          cd route-branching
          git add --all
          echo 'DIFFSTAT<<EOF' >> "$GITHUB_ENV"
          git diff --staged --compact-summary | tee -a "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"
          git diff --staged --color --exit-code --src-prefix="      api-dev/" --dst-prefix="api-dev-green/" && git status
      - name: Report diff
        if: ${{ steps.diff.outcome == 'failure' }}
        env:
          RUN_URL: ${{ fromJSON(steps.run_urls.outputs.run_urls)['Calculate diffs'] }}
          SLACK_WEBHOOK: ${{ secrets.CHECKS_SLACK_WEBHOOK }}
        run: |
          jq --null-input '{text: "⚠️ Route branching different between api-dev and api-dev-green:\n\(env.DIFFSTAT)", url: "\(env.RUN_URL)"}' | \
            curl -X POST --json @- $SLACK_WEBHOOK
