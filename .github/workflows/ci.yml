name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    uses: $/.github/workflows/zizmor.yml

  setup:
    uses: $/.github/workflows/setup.yml

  build_elixir:
    name: Build and test Elixir
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Load asdf and Elixir dependencies
        uses: $/.github/actions/load-setup
        with:
          cache-key-asdf: ${{ needs.setup.outputs.cache-key-asdf }}
          cache-key-mix: ${{ needs.setup.outputs.cache-key-mix }}
      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors
      - name: Credo
        run: mix credo --strict
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test --cover
      - uses: mbta/actions/dialyzer@788f8e264e9ebb1b76b927c89e6466d5a162be80 # v2.24
      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused
